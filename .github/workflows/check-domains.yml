name: 域名定时更新工作流

on:
  schedule:
    - cron: '*/30 * * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Extract domains
        # avfan 是会员站：磁力接口必须带会话 cookie 才能探活。没配这个 secret 时
        # check_domains.py 会跳过 avfan 探测并保留上次的域名，不影响其它源。
        env:
          AVFAN_COOKIE: ${{ secrets.AVFAN_COOKIE }}
        run: python check_domains.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domains.json
          if git diff --staged --quiet; then
            echo "domains.json 没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新域名"
            git push
          fi
